name: Reno Final SEO Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reno-final-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GSC_SITE_URL: sc-domain:renorangers.be
      GOOGLE_ADS_CUSTOMER_ID: "6046553882"
      GOOGLE_ADS_API_VERSION: v25
      GOOGLE_ADC_JSON: ${{ secrets.GOOGLE_ADC_JSON }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEO_AUTOMATION_ENABLED: ${{ vars.SEO_AUTOMATION_ENABLED }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Verify configuration and collect live evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_ADC_JSON" || { echo 'GOOGLE_ADC_JSON missing'; exit 1; }
          test -n "$GOOGLE_ADS_DEVELOPER_TOKEN" || { echo 'GOOGLE_ADS_DEVELOPER_TOKEN missing'; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo 'ANTHROPIC_API_KEY missing'; exit 1; }
          if [ "$SEO_AUTOMATION_ENABLED" != "true" ]; then
            echo "SEO_AUTOMATION_ENABLED is not true: ${SEO_AUTOMATION_ENABLED:-unset}"
            exit 1
          fi
          python renorangers-site-2/scripts/seo_weekly_collect_service.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('seo-weekly-context.json')
          if not p.exists():
              raise SystemExit('seo-weekly-context.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          gsc = d.get('gsc') or {}
          ads = d.get('google_ads') or {}
          if gsc.get('error'):
              raise SystemExit(f"GSC failed: {gsc['error']}")
          if ads.get('error'):
              raise SystemExit(f"Google Ads failed: {ads['error']}")
          print('GSC_OK')
          print('GOOGLE_ADS_OK')
          print('ANTHROPIC_KEY_PRESENT')
          print('TELEGRAM_CONFIGURED=' + ('yes' if bool(__import__('os').environ.get('TELEGRAM_BOT_TOKEN') and __import__('os').environ.get('TELEGRAM_CHAT_ID')) else 'no'))
          print('SEO_AUTOMATION_ENABLED=true')
          PY
