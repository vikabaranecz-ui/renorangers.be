name: Reno Rangers Fresh Public SEO Crawl

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'renorangers-site-2/scripts/fresh_rendered_seo_crawl.mjs'
      - '.github/workflows/reno-fresh-public-seo-crawl.yml'

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init -y >/dev/null 2>&1
      - run: npm install playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Crawl rendered live production site
        run: node renorangers-site-2/scripts/fresh_rendered_seo_crawl.mjs
