name: Reno Rangers Fresh Public SEO Crawl

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'renorangers-site-2/scripts/fresh_public_seo_crawl.py'
      - '.github/workflows/reno-fresh-public-seo-crawl.yml'

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Crawl live production site
        run: python renorangers-site-2/scripts/fresh_public_seo_crawl.py
