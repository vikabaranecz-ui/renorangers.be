name: Reno Rangers Keyword Planner Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reno-keyword-planner-check.yml'
      - 'renorangers-site-2/scripts/google_ads_keyword_planner_check.py'

permissions:
  contents: read

jobs:
  check-keyword-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_ADC_JSON: ${{ secrets.GOOGLE_ADC_JSON }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_ADS_API_VERSION: v25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Verify Belgium and Antwerp Keyword Planner
        run: python renorangers-site-2/scripts/google_ads_keyword_planner_check.py
