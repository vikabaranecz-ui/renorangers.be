name: Reno Run Today Relay

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reno-run-today-relay.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch real Reno weekly SEO workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reno-weekly-seo-claude.yml --repo "$GITHUB_REPOSITORY" -f force=true
