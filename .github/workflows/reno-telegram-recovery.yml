name: Reno Telegram Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reno-telegram-recovery.yml"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Reno status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s\n' 'Reno Rangers SEO — 2026-09-14' 'KPI: 2/25 keywords confirmed in Top 5 (last completed sprint)' 'Today: scheduled sprint was skipped by the old delayed-run time guard' 'Action: schedule fixed to Monday 08:00 Europe/Brussels, same as IsoproTech' 'Website health: last full QA PASS — 20/20 sitemap URLs' 'Result: no Reno SEO changes were made today' 'Next: next Monday will run the normal evidence-based sprint' > message.txt
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text@message.txt" >/dev/null
