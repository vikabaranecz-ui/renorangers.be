name: Reno Weekly SEO Claude

on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "Europe/Brussels"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's SEO report already exists"
        required: false
        default: false
        type: boolean

concurrency:
  group: reno-weekly-seo-claude
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  weekly-seo:
    if: github.event_name == 'workflow_dispatch' || vars.SEO_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GSC_SITE_URL: sc-domain:renorangers.be
      GOOGLE_ADS_CUSTOMER_ID: "6046553882"
      GOOGLE_ADS_API_VERSION: v25
      GOOGLE_ADC_JSON: ${{ secrets.GOOGLE_ADC_JSON }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}

    steps:
      - name: Skip duplicate same-day run
        id: duplicate
        env:
          FORCE_RUN: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          TODAY="$(TZ=Europe/Brussels date +%F)"
          if [ "$FORCE_RUN" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT="$(gh issue list --repo "$GITHUB_REPOSITORY" --search "SEO Weekly — ${TODAY} in:title" --limit 1 --json number --jq 'length')"
          if [ "$COUNT" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        if: steps.duplicate.outputs.skip != 'true'
        run: python -m pip install --disable-pip-version-check requests google-auth

      - name: Collect GSC and Keyword Planner evidence
        if: steps.duplicate.outputs.skip != 'true'
        run: python renorangers-site-2/scripts/seo_weekly_collect_service.py

      - name: Validate evidence
        if: steps.duplicate.outputs.skip != 'true'
        id: evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('seo-weekly-context.json')
          out = Path(os.environ['GITHUB_OUTPUT'])
          ready = False
          reason = ''
          warning = ''
          if not p.exists():
              reason = 'SEO evidence file missing.'
          else:
              d = json.loads(p.read_text(encoding='utf-8'))
              gsc_error = (d.get('gsc') or {}).get('error') if isinstance(d.get('gsc'), dict) else 'invalid GSC block'
              ads_error = (d.get('google_ads') or {}).get('error') if isinstance(d.get('google_ads'), dict) else 'invalid Ads block'
              ready = not bool(gsc_error)
              if gsc_error:
                  reason = f'GSC unavailable: {gsc_error}'
              if ads_error:
                  warning = 'Keyword Planner unavailable; see seo-weekly-context artifact for details.'
          with out.open('a', encoding='utf-8') as f:
              f.write(f"ready={'true' if ready else 'false'}\n")
              f.write(f"reason={reason.replace(chr(10), ' ').replace(chr(13), ' ')}\n")
              f.write(f"warning={warning}\n")
          print('Claude ready:', ready)
          print(reason or warning)
          PY

      - name: Upload weekly evidence
        if: steps.duplicate.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: reno-seo-weekly-context-${{ github.run_id }}
          path: seo-weekly-context.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify Claude key
        if: steps.duplicate.outputs.skip != 'true' && steps.evidence.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is missing"
            exit 1
          fi

      - name: Run Reno weekly SEO growth agent
        if: steps.duplicate.outputs.skip != 'true' && steps.evidence.outputs.ready == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            This is the scheduled RENO RANGERS weekly SEO growth run. Determine today's date in Europe/Brussels.

            Read `.claude/agents/reno-weekly-seo.md` in full and follow it as the governing policy.
            Read `renorangers-site-2/seo/business_profile.json`, `renorangers-site-2/seo/automation_policy.json`, `renorangers-site-2/seo/growth_strategy.json`, `renorangers-site-2/seo/keyword_targets.json`, and `seo-weekly-context.json`.

            Execute one coherent evidence-based ranking sprint for the highest-value cluster. The year-end KPI is 25 commercially relevant primary queries in Google Top 5 by 2026-12-31; never describe it as guaranteed.
            Protect website technical health and conversion paths before growth changes.
            Optimize for qualified renovation leads, not traffic alone.
            Maintain a strategic B2B track to attract architects, interior architects and designers looking for a dependable execution/work partner.
            Antwerp + approximately 25 km is the verified market. Do not broaden to all Vlaanderen.
            Use Antwerp Keyword Planner evidence before Belgium-wide volume when choosing local priorities.
            Do not target new-build merely because Search Console shows impressions.

            For SAFE FIX, create a PR, QA it and merge only if every change is inside the safe-auto-publish policy and checks pass.
            For NEEDS APPROVAL, prepare the exact PR and QA it but leave it open and unmerged.
            Always create the required `SEO Weekly — YYYY-MM-DD — <MODE>` GitHub issue with Top-5 progress X/25, website-health status, evidence, lead/partnership value and completed work.

            Also write a short plain-text file named `seo-telegram-summary.txt` for the owner. It must contain only the most important information, maximum 9 lines, in this exact structure:
            ✅ Reno Rangers SEO — YYYY-MM-DD
            KPI: X/25 keywords in Top 5
            Focus: <short chosen cluster>
            Rankings: <up to 3 most important current ranking positions/opportunities>
            Demand: <up to 3 most important Antwerp monthly-search figures>
            Action: <what was actually changed or prepared>
            Website health: <PASS/ISSUE + one short fact>
            Result: <merged / awaiting approval / analysis only>
            Next: <single highest-value next move>
            Use normal line breaks, no markdown table, no percent-encoded characters, no invented numbers.
          claude_args: |
            --model claude-sonnet-5
            --effort medium
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(python:*),Bash(python3:*),Bash(cat:*),Bash(pwd),Bash(ls:*)"

      - name: Send optional Telegram summary
        if: steps.duplicate.outputs.skip != 'true' && always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          EVIDENCE_READY: ${{ steps.evidence.outputs.ready }}
          EVIDENCE_WARNING: ${{ steps.evidence.outputs.warning }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram not configured; GitHub issue/PR remains the source of truth."
            exit 0
          fi

          TODAY="$(TZ=Europe/Brussels date +%F)"
          ISSUE_URL="$(gh issue list --repo "$GITHUB_REPOSITORY" --search "SEO Weekly — ${TODAY} in:title" --limit 1 --json url --jq '.[0].url // empty')"

          if [ -s seo-telegram-summary.txt ]; then
            TEXT="$(cat seo-telegram-summary.txt)"
          else
            STATUS="⚠️ Claude ${CLAUDE_OUTCOME:-not-run}"
            if [ "${CLAUDE_OUTCOME:-}" = "success" ]; then STATUS="✅ Claude success"; fi
            TEXT="Reno Rangers SEO — ${TODAY}
${STATUS}
Evidence ready: ${EVIDENCE_READY:-false}"
            if [ -n "${EVIDENCE_WARNING:-}" ]; then
              TEXT="${TEXT}
${EVIDENCE_WARNING}"
            fi
          fi

          if [ -n "$ISSUE_URL" ]; then
            TEXT="${TEXT}
Report: ${ISSUE_URL}"
          fi

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" >/dev/null
