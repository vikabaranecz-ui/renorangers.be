name: Reno Rangers Google SEO Evidence Refresh (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'renorangers-site-2/scripts/seo_*.py'
      - '.claude/agents/reno-weekly-seo.md'
      - '.github/workflows/seo-google-evidence-refresh.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SEO_BASE_URL: https://www.renorangers.be
      GSC_SITE_URL: sc-domain:renorangers.be
      GOOGLE_ADC_JSON: ${{ secrets.GOOGLE_ADC_JSON }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_ADS_CUSTOMER_ID: '6046553882'
      GOOGLE_ADS_API_VERSION: v25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google collector dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 google-auth
      - name: Compile SEO evidence scripts
        run: |
          python -m py_compile renorangers-site-2/scripts/seo_weekly_collect_service.py
          python -m py_compile renorangers-site-2/scripts/seo_evidence_digest.py
          python -m py_compile renorangers-site-2/scripts/seo_indexing_audit.py
      - name: Collect current Search Console and Keyword Planner evidence
        run: python renorangers-site-2/scripts/seo_weekly_collect_service.py
      - name: Inspect priority Google indexed-version URLs (read only)
        continue-on-error: true
        run: python renorangers-site-2/scripts/seo_indexing_audit.py
      - name: Build compact SEO action evidence
        run: python renorangers-site-2/scripts/seo_evidence_digest.py
      - name: Verify source health and display recent local topics
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("seo-weekly-context-compact.json").read_text(encoding="utf-8"))
          gs=d.get("gsc") or {}
          ads=d.get("keyword_planner") or {}
          status=(ads.get("source_quality") or {}).get("antwerp")
          gs_ok=not gs.get("error") and bool(gs.get("current_period"))
          kp_ok=status=="OK"
          audit=json.loads(Path("seo-indexing-audit.json").read_text(encoding="utf-8")) if Path("seo-indexing-audit.json").exists() else {}
          lines=["## Current authenticated Google SEO evidence",
                 f"- GSC: {'PASS' if gs_ok else 'FAILED / UNVERIFIED'}",
                 f"- Antwerp Keyword Planner: {'PASS' if kp_ok else 'FAILED / UNVERIFIED'}",
                 f"- Google URL Inspection: {audit.get('inspected_urls','UNAVAILABLE')} URLs",
                 "- Keyword Planner data is historical estimated monthly demand, not live search data"]
          if gs_ok:
              lines.append(f"- GSC score Top5 (raw / ≥10 impressions): {gs.get('top5_raw')} / {gs.get('top5_at_least_10_impressions')}")
          if kp_ok:
              for row in ads.get("antwerp_top_relevant",[])[:7]:
                  lines.append(f"- Keyword: {row.get('keyword')} — Antwerp {row.get('avg_monthly_searches','unknown')}/mo, latest history {row.get('trend_observation_end') or 'not returned'}")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          print("\n".join(lines))
          if not gs_ok or not kp_ok:
              raise SystemExit("Google SEO evidence missing; stop claiming 'hot searches'.")
          PY
      - name: Store evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reno-google-seo-evidence-${{ github.run_id }}
          path: |
            seo-weekly-context.json
            seo-weekly-context-compact.json
            seo-indexing-audit.json
          retention-days: 30
          if-no-files-found: warn
